<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Order Enquiry – Primestyle Clothing</title>




    <!-- Primary Meta Tags -->
    <meta name="title" content="Primestyle Clothing – Custom Premium Streetwear Manufacturing">
    <meta name="description"
        content="Manufacturing high-quality oversized tees, hoodies, custom brand apparel and corporate merchandise. Low MOQ – Fast delivery – Premium fabrics – Professional finishing. Build your brand with Primestyle Clothing.">

    <!-- Keywords -->
    <meta name="keywords"
        content="streetwear manufacturing, custom clothing manufacturer India, oversized t-shirt manufacturer, hoodie manufacturer, clothing brand manufacturer India, custom apparel, premium fabric apparel, low MOQ clothing manufacturer, Primestyle Clothing">

    <meta name="author" content="Primestyle Clothing">
    <meta name="robots" content="index, follow">

    <!-- Mobile -->
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Theme Color -->
    <meta name="theme-color" content="#e5c16f">

    <!-- Open Graph (Facebook, Instagram, WhatsApp) -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://primestyleclothing.in/">
    <meta property="og:title" content="Primestyle Clothing – Premium Streetwear Manufacturing">
    <meta property="og:description"
        content="Premium quality custom apparel manufacturing. Oversized tees, hoodies, corporate branding, printing & embroidery.">
    <meta property="og:image" content="https://primestyleclothing.in/assets/images/preview.jpg">

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Primestyle Clothing – Premium Streetwear Manufacturing">
    <meta name="twitter:description"
        content="Premium quality custom apparel manufacturing with low MOQ and fast delivery.">
    <meta name="twitter:image" content="https://primestyleclothing.in/assets/images/preview.jpg">

    <!-- Favicon -->
    <link rel="icon" href="/assets/images/favicon.ico" sizes="any">
    <link rel="icon" type="image/png" href="/assets/images/favicon_32x32.png">
    <link rel="apple-touch-icon" href="/assets/images/favicon_180x180.png">

    <!-- Web Manifest -->
    <!-- <link rel="manifest" href="/site.webmanifest"> -->





    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Montserrat:wght@600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="enquiry.css">

    <!-- ICON LIBRARY (phosphor-icons) -->
    <script src="https://unpkg.com/phosphor-icons"></script>

    <script>
        async function uploadToCloudinary(file) {
            const url = `https://api.cloudinary.com/v1_1/dpf1e4ewj/image/upload`;

            const formData = new FormData();
            formData.append("file", file);
            formData.append("upload_preset", "primestyle_enquiry_data");

            const response = await fetch(url, {
                method: "POST",
                body: formData
            });

            const data = await response.json();
            return data.secure_url;  // Returns cloud link
        }
    </script>

</head>

<body>
    <header class="enquiry-header">
        <h1>Start Your Order Enquiry</h1>
        <p>Tell us what you need — we’ll respond with a personalised quote.</p>
    </header>

    <section class="enquiry-container">

        <form name="order-enquiry" method="POST" data-netlify="true" enctype="multipart/form-data">

            <input type="hidden" name="form-name" value="order-enquiry">
            <input type="hidden" id="imageUrlInput" name="image_url">
            <input type="hidden" name="redirect" value="/thank-you.html">

            <!-- ORDER CATEGORY -->
            <div class="form-group">
                <label><i class="ph ph-list-bullets"></i> Order Category *</label>
                <select name="Order Category" required>
                    <option value="" disabled selected>Select one</option>
                    <option>Plain Apparel</option>
                    <option>Custom Brand Apparel</option>
                    <option>Corporate / Events</option>
                    <option>Bulk Streetwear Manufacturing</option>
                    <option>Printing Only</option>
                    <option>Embroidery Only</option>
                </select>
            </div>

            <!-- PRODUCT DETAILS -->
            <div class="form-row">
                <div class="form-group">
                    <label><i class="ph ph-t-shirt"></i> Product Type *</label>
                    <input type="text" name="Product Type" placeholder="Oversized Tee, Hoodie, etc." required>
                </div>

                <div class="form-group">
                    <label><i class="ph ph-stack"></i> Quantity *</label>
                    <input type="number" name="Quantity" placeholder="MOQ 30+" required>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label><i class="ph ph-ruler"></i> Sizes</label>
                    <input type="text" name="Sizes" placeholder="S, M, L, XL">
                </div>

                <div class="form-group">
                    <label><i class="ph ph-palette"></i> Colors</label>
                    <input type="text" name="Colors" placeholder="Black, White, etc.">
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label><i class="ph ph-fabric"></i> Fabric (Optional)</label>
                    <input type="text" name="Fabric" placeholder="Cotton, French Terry, Fleece (optional)">
                </div>

                <div class="form-group">
                    <label><i class="ph ph-paint-brush"></i> Printing Type (Optional)</label>
                    <input type="text" name="Printing Type" placeholder="DTF, Screen, Puff, etc.">
                </div>
            </div>

            <div class="form-group">
                <label><i class="ph ph-needle"></i> Embroidery (Optional)</label>
                <input type="text" name="Embroidery" placeholder="Front chest, back, etc.">
            </div>

            <!-- BRANDING -->
            <div class="form-row">
                <div class="form-group">
                    <label><i class="ph ph-tag"></i> Custom Labels (Optional)</label>
                    <input type="text" name="Custom Labels" placeholder="Woven label, printed label, etc.">
                </div>

                <div class="form-group">
                    <label><i class="ph ph-package"></i> Packaging (Optional)</label>
                    <input type="text" name="Packaging" placeholder="Polybag, Ziplock, Custom box">
                </div>
            </div>

            <!-- REFERNCE -->
            <div class="form-group">
                <label><i class="ph ph-upload"></i> Upload Reference (Optional)</label>
                <!-- <input type="file" name="Reference File"> -->
                <input type="file" id="imageUpload" accept="image/*" name="Reference File">
                <input type="hidden" name="image_url" id="imageUrlInput">


            </div>

            <div class="form-group">
                <label><i class="ph ph-note"></i> Additional Notes</label>
                <textarea name="Additional Notes" rows="4" placeholder="Any extra details..."></textarea>
            </div>

            <!-- CONTACT DETAILS -->
            <h3 class="section-title">Your Contact Details</h3>

            <div class="form-row">
                <div class="form-group">
                    <label><i class="ph ph-user"></i> Name *</label>
                    <input type="text" name="Name" required>
                </div>

                <div class="form-group">
                    <label><i class="ph ph-envelope"></i> Email *</label>
                    <input type="email" name="Email" required>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label><i class="ph ph-phone-call"></i> Phone Number *</label>
                    <input type="tel" name="Phone" required>
                </div>

                <div class="form-group">
                    <label><i class="ph ph-whatsapp-logo"></i> WhatsApp (Optional)</label>
                    <input type="tel" name="WhatsApp">
                </div>
            </div>

            <!-- SUBMIT -->
            <button type="submit" class="submit-btn">
                <i class="ph ph-paper-plane-tilt"></i> Enquire Now
            </button>

        </form>
    </section>
    <script src="enquiry.js"></script>

</body>

</html>
